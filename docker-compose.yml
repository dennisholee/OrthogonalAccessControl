version: "3.8"
services:
  mongodb:
    image: mongo:7.0
    container_name: oac-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: oac_authorization
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data: